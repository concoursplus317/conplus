<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏆 Éloquence en Scène - Jury</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: linear-gradient(135deg, #0055a4, #ef4135);
            border-radius: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        header .logo { font-size: 1.3rem; font-weight: 700; }
        header .logo i { margin-right: 10px; }
        header .jury-name {
            background: rgba(255,255,255,0.15);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .card h2 {
            color: #d4af37;
            font-size: 1.1rem;
            margin-bottom: 16px;
        }
        .card h2 i { margin-right: 10px; }

        /* Candidat actuel */
        .candidat-actuel {
            text-align: center;
            padding: 20px;
        }
        .candidat-actuel .photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #1a1a2e;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border: 3px solid #d4af37;
            overflow: hidden;
        }
        .candidat-actuel .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .candidat-actuel .nom {
            font-size: 1.6rem;
            font-weight: 700;
        }
        .candidat-actuel .role {
            display: inline-block;
            padding: 4px 20px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 8px;
        }
        .role.these { background: #0055a4; }
        .role.antithese { background: #ef4135; }
        .candidat-actuel .theme {
            margin-top: 12px;
            color: #aaa;
            font-style: italic;
            font-size: 0.9rem;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            border-left: 3px solid #d4af37;
        }
        .candidat-actuel .status {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #f59e0b;
        }

        /* Timer */
        .timer-display {
            text-align: center;
            padding: 16px;
        }
        .timer-display .clock {
            font-size: 4rem;
            font-weight: 800;
            font-family: 'Poppins', monospace;
            color: #d4af37;
        }
        .timer-display .clock.warning { color: #f59e0b; animation: pulse 0.5s infinite alternate; }
        .timer-display .clock.danger { color: #ef4444; animation: pulse 0.3s infinite alternate; }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.5; transform: scale(1.05); }
        }
        .timer-display .status-text { font-size: 0.8rem; color: #888; }

        /* Grille des critères */
        .criteria-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 600px) {
            .criteria-grid { grid-template-columns: 1fr; }
        }
        .criteria-item {
            background: rgba(255,255,255,0.03);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .criteria-item label {
            font-size: 0.75rem;
            color: #aaa;
            display: block;
            margin-bottom: 4px;
        }
        .criteria-item label .max {
            float: right;
            color: #d4af37;
            font-weight: 600;
        }
        .criteria-item input {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
        }
        .criteria-item input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 20px rgba(212,175,55,0.1);
        }
        .criteria-item input:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Total */
        .total-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: linear-gradient(135deg, #0055a4, #ef4135);
            border-radius: 12px;
            margin: 16px 0;
        }
        .total-section .label { color: rgba(255,255,255,0.7); font-size: 0.9rem; }
        .total-section .value {
            font-size: 2.2rem;
            font-weight: 800;
            color: #d4af37;
        }
        .total-section .value .sur { font-size: 1rem; color: rgba(255,255,255,0.3); }

        /* Commentaire */
        .comment-area textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            resize: vertical;
            min-height: 50px;
        }
        .comment-area textarea:focus {
            outline: none;
            border-color: #d4af37;
        }
        .comment-area textarea:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Boutons */
        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .actions button {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 120px;
        }
        .actions button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-valider {
            background: linear-gradient(135deg, #0055a4, #003d7a);
            color: #fff;
        }
        .btn-valider:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,85,164,0.3);
        }
        .btn-brouillon {
            background: transparent;
            color: #f59e0b;
            border: 2px solid rgba(245,158,11,0.3);
        }
        .btn-brouillon:hover:not(:disabled) {
            border-color: #f59e0b;
        }
        .btn-probleme {
            background: rgba(239,68,68,0.15);
            color: #ef4444;
            border: 1px solid rgba(239,68,68,0.2);
        }
        .btn-probleme:hover:not(:disabled) {
            background: rgba(239,68,68,0.25);
        }

        /* Statut */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 16px;
            font-size: 0.75rem;
            color: #666;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(16,185,129,0.95);
            color: #fff;
            padding: 14px 28px;
            border-radius: 16px;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            transition: all 0.5s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            max-width: 90%;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: rgba(239,68,68,0.95); }
        .toast.warning { background: rgba(245,158,11,0.95); }

        .jury-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .jury-selector label { font-size: 0.8rem; color: #aaa; }
        .jury-selector select {
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            min-width: 120px;
        }
        .jury-selector select:focus {
            outline: none;
            border-color: #d4af37;
        }
        .jury-selector select option { background: #0a0a1a; }
        
        .jury-count-info {
            font-size: 0.7rem;
            color: #666;
            padding: 4px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo"><i class="fas fa-gavel"></i> Jury Éloquence</div>
            <div class="jury-name">
                <i class="fas fa-user-check"></i> 
                <span id="juryNameDisplay">Jury 1</span>
                <span class="jury-count-info" id="juryCountInfo">👥 0 jurys</span>
            </div>
        </header>

        <!-- Candidat actuel -->
        <div class="card" id="candidatCard">
            <h2><i class="fas fa-user-tie"></i> Candidat actuel</h2>
            <div class="candidat-actuel" id="candidatInfo">
                <div class="photo" id="photoContainer">
                    <i class="fas fa-user"></i>
                </div>
                <div class="nom" id="candidatNom">En attente...</div>
                <div class="role" id="candidatRole" style="display:none;">Thèse</div>
                <div class="theme" id="candidatTheme">Aucun candidat sélectionné</div>
                <div class="status" id="candidatStatus">⏳ En attente d'un candidat</div>
            </div>
        </div>

        <!-- Timer -->
        <div class="card">
            <h2><i class="fas fa-clock"></i> Chronomètre</h2>
            <div class="timer-display">
                <div class="clock" id="timerClock">05:00</div>
                <div class="status-text" id="timerStatus">⏸️ En pause</div>
            </div>
        </div>

        <!-- Sélecteur Jury -->
        <div class="card">
            <h2><i class="fas fa-users"></i> Identifiez-vous</h2>
            <div class="jury-selector">
                <label><i class="fas fa-id-badge"></i> Votre nom :</label>
                <select id="jurySelect">
                    <option value="">-- Choisissez --</option>
                </select>
                <span style="font-size:0.7rem;color:#555;margin-left:auto;" id="selectedJuryInfo">Sélectionnez votre nom</span>
            </div>
            <div style="font-size:0.7rem;color:#555;padding:8px 12px;background:rgba(255,255,255,0.03);border-radius:8px;">
                <i class="fas fa-info-circle"></i> Chaque jury doit choisir son nom. Les votes sont individuels.
            </div>
        </div>

        <!-- Grille de notation -->
        <div class="card">
            <h2><i class="fas fa-star"></i> Notation</h2>
            <div class="criteria-grid">
                <div class="criteria-item">
                    <label>Éloquence <span class="max">/20</span></label>
                    <input type="number" id="eloquence" min="0" max="20" step="0.5" value="0" disabled>
                </div>
                <div class="criteria-item">
                    <label>Argumentation <span class="max">/20</span></label>
                    <input type="number" id="argumentation" min="0" max="20" step="0.5" value="0" disabled>
                </div>
                <div class="criteria-item">
                    <label>Structure <span class="max">/20</span></label>
                    <input type="number" id="structure" min="0" max="20" step="0.5" value="0" disabled>
                </div>
                <div class="criteria-item">
                    <label>Gestuelle <span class="max">/20</span></label>
                    <input type="number" id="gestuelle" min="0" max="20" step="0.5" value="0" disabled>
                </div>
            </div>

            <div class="total-section">
                <span class="label">Total</span>
                <span class="value"><span id="totalScore">0</span><span class="sur"> /80</span></span>
            </div>

            <div class="comment-area">
                <textarea id="commentaire" placeholder="Commentaire (optionnel)" disabled></textarea>
            </div>

            <div class="actions">
                <button class="btn-valider" id="validerBtn" disabled><i class="fas fa-check"></i> Valider</button>
                <button class="btn-brouillon" id="brouillonBtn" disabled><i class="fas fa-save"></i> Brouillon</button>
                <button class="btn-probleme" id="problemeBtn" disabled><i class="fas fa-exclamation-triangle"></i> Problème</button>
            </div>

            <div class="status-bar">
                <span id="voteStatus"><i class="fas fa-circle" style="color:#666;"></i> Non coté</span>
                <span id="lastUpdate">-</span>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // 🔥 CONFIGURATION FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCOSnZ0ogR05svM0SbALqSlNqmODDDlIyw",
            authDomain: "conf-94615.firebaseapp.com",
            projectId: "conf-94615",
            storageBucket: "conf-94615.firebasestorage.app",
            messagingSenderId: "312554343685",
            appId: "1:312554343685:web:b199e33ff4ca050d533b6c"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Variables
        let currentJury = '';
        let currentCandidat = null;
        let currentMatchId = null;
        let hasVoted = false;
        let isDraft = false;
        let juryList = [];
        let notificationTimeout = null;

        // Éléments DOM
        const jurySelect = document.getElementById('jurySelect');
        const juryNameDisplay = document.getElementById('juryNameDisplay');
        const juryCountInfo = document.getElementById('juryCountInfo');
        const selectedJuryInfo = document.getElementById('selectedJuryInfo');
        const candidatNom = document.getElementById('candidatNom');
        const candidatRole = document.getElementById('candidatRole');
        const candidatTheme = document.getElementById('candidatTheme');
        const candidatStatus = document.getElementById('candidatStatus');
        const photoContainer = document.getElementById('photoContainer');
        const timerClock = document.getElementById('timerClock');
        const timerStatus = document.getElementById('timerStatus');
        const eloquence = document.getElementById('eloquence');
        const argumentation = document.getElementById('argumentation');
        const structure = document.getElementById('structure');
        const gestuelle = document.getElementById('gestuelle');
        const totalScore = document.getElementById('totalScore');
        const commentaire = document.getElementById('commentaire');
        const validerBtn = document.getElementById('validerBtn');
        const brouillonBtn = document.getElementById('brouillonBtn');
        const problemeBtn = document.getElementById('problemeBtn');
        const voteStatus = document.getElementById('voteStatus');
        const lastUpdate = document.getElementById('lastUpdate');
        const toast = document.getElementById('toast');

        // Fonctions
        function showToast(message, type = 'info') {
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            clearTimeout(notificationTimeout);
            notificationTimeout = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function calculerTotal() {
            const e = parseFloat(eloquence.value) || 0;
            const a = parseFloat(argumentation.value) || 0;
            const s = parseFloat(structure.value) || 0;
            const g = parseFloat(gestuelle.value) || 0;
            const total = e + a + s + g;
            totalScore.textContent = total.toFixed(1);
            return total;
        }

        // Écouter les changements des champs
        [eloquence, argumentation, structure, gestuelle].forEach(input => {
            input.addEventListener('input', () => {
                const val = parseFloat(input.value);
                if (val < 0) input.value = 0;
                if (val > 20) input.value = 20;
                calculerTotal();
            });
        });

        // Écouter la liste des jurys (définie par le centre de contrôle)
        function ecouterJurys() {
            db.collection('jurys').doc('liste').onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data && data.jurys && Array.isArray(data.jurys)) {
                        juryList = data.jurys;
                    } else {
                        juryList = ['Jury 1'];
                    }
                } else {
                    juryList = ['Jury 1'];
                }
                mettreAJourListeJurys();
            }, (error) => {
                console.error('❌ Erreur écoute jurys:', error);
                juryList = ['Jury 1'];
                mettreAJourListeJurys();
            });
        }

        function mettreAJourListeJurys() {
            // Mettre à jour le select
            const currentValue = jurySelect.value;
            jurySelect.innerHTML = '<option value="">-- Choisissez --</option>';
            juryList.forEach(j => {
                const opt = document.createElement('option');
                opt.value = j;
                opt.textContent = j;
                jurySelect.appendChild(opt);
            });
            // Restaurer la sélection si possible
            if (juryList.includes(currentValue)) {
                jurySelect.value = currentValue;
            } else {
                jurySelect.value = '';
            }
            
            // Mettre à jour l'affichage
            juryCountInfo.textContent = `👥 ${juryList.length} jurys`;
            
            // Si un jury est sélectionné, mettre à jour l'affichage
            if (currentJury) {
                juryNameDisplay.textContent = currentJury;
                selectedJuryInfo.textContent = `✅ ${currentJury}`;
            } else {
                juryNameDisplay.textContent = 'Non sélectionné';
                selectedJuryInfo.textContent = '⚠️ Sélectionnez votre nom';
            }
        }

        // Sélection du jury
        jurySelect.addEventListener('change', function() {
            currentJury = this.value;
            if (currentJury) {
                juryNameDisplay.textContent = currentJury;
                selectedJuryInfo.textContent = `✅ ${currentJury}`;
                showToast(`👤 Bienvenue ${currentJury}`, 'success');
                // Recharger la cotation si un candidat est en cours
                if (currentCandidat) {
                    chargerCotation(currentCandidat);
                }
            } else {
                juryNameDisplay.textContent = 'Non sélectionné';
                selectedJuryInfo.textContent = '⚠️ Sélectionnez votre nom';
                desactiverChamps();
            }
        });

        // Écouter l'état (candidat actuel)
        function ecouterEtat() {
            db.collection('etat').doc('current').onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    currentCandidat = data.candidatNom || null;
                    currentMatchId = data.matchId || null;
                    const nbJurys = data.nombreJurys || 0;

                    if (currentCandidat) {
                        candidatNom.textContent = currentCandidat;
                        candidatTheme.textContent = `"${data.candidatTheme || 'Thème'}"`;
                        candidatRole.textContent = data.candidatRole || 'Thèse';
                        candidatRole.style.display = 'inline-block';
                        candidatRole.className = `role ${(data.candidatRole || 'thèse').toLowerCase()}`;
                        candidatStatus.textContent = '🎯 En cours d\'évaluation';
                        candidatStatus.style.color = '#10b981';

                        // Photo
                        if (data.candidatPhoto) {
                            photoContainer.innerHTML = `<img src="${data.candidatPhoto}" alt="Photo">`;
                        } else {
                            photoContainer.innerHTML = `<i class="fas fa-user"></i>`;
                        }

                        // Activer les champs si un jury est sélectionné
                        if (currentJury) {
                            eloquence.disabled = false;
                            argumentation.disabled = false;
                            structure.disabled = false;
                            gestuelle.disabled = false;
                            commentaire.disabled = false;
                            validerBtn.disabled = false;
                            brouillonBtn.disabled = false;
                            problemeBtn.disabled = false;
                            // Charger la cotation existante
                            chargerCotation(currentCandidat);
                        } else {
                            desactiverChamps();
                            candidatStatus.textContent = '⚠️ Sélectionnez votre nom pour voter';
                            candidatStatus.style.color = '#f59e0b';
                        }

                    } else {
                        candidatNom.textContent = 'En attente...';
                        candidatTheme.textContent = 'Aucun candidat sélectionné';
                        candidatRole.style.display = 'none';
                        candidatStatus.textContent = '⏳ En attente d\'un candidat';
                        candidatStatus.style.color = '#f59e0b';
                        photoContainer.innerHTML = `<i class="fas fa-user"></i>`;
                        desactiverChamps();
                    }
                }
            }, (error) => {
                console.error('❌ Erreur écoute état:', error);
            });
        }

        function chargerCotation(candidat) {
            if (!currentJury) return;
            db.collection('cotations').doc(candidat).get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    const juryData = data[currentJury];
                    if (juryData) {
                        eloquence.value = juryData.eloquence || 0;
                        argumentation.value = juryData.argumentation || 0;
                        structure.value = juryData.structure || 0;
                        gestuelle.value = juryData.gestuelle || 0;
                        commentaire.value = juryData.commentaire || '';
                        calculerTotal();
                        hasVoted = juryData.valide || false;
                        isDraft = !hasVoted && (juryData.eloquence !== undefined);
                        mettreAJourStatut();
                    } else {
                        reinitialiserChamps();
                    }
                } else {
                    reinitialiserChamps();
                }
            }).catch((error) => {
                console.error('❌ Erreur chargement cotation:', error);
            });
        }

        function reinitialiserChamps() {
            eloquence.value = 0;
            argumentation.value = 0;
            structure.value = 0;
            gestuelle.value = 0;
            commentaire.value = '';
            calculerTotal();
            hasVoted = false;
            isDraft = false;
            mettreAJourStatut();
        }

        function desactiverChamps() {
            eloquence.disabled = true;
            argumentation.disabled = true;
            structure.disabled = true;
            gestuelle.disabled = true;
            commentaire.disabled = true;
            validerBtn.disabled = true;
            brouillonBtn.disabled = true;
            problemeBtn.disabled = true;
            reinitialiserChamps();
        }

        function mettreAJourStatut() {
            if (hasVoted) {
                voteStatus.innerHTML = `<i class="fas fa-check-circle" style="color:#10b981;"></i> ✅ Validé`;
                voteStatus.style.color = '#10b981';
            } else if (isDraft) {
                voteStatus.innerHTML = `<i class="fas fa-pencil-alt" style="color:#f59e0b;"></i> 📝 Brouillon`;
                voteStatus.style.color = '#f59e0b';
            } else {
                voteStatus.innerHTML = `<i class="fas fa-circle" style="color:#666;"></i> Non coté`;
                voteStatus.style.color = '#666';
            }
        }

        // Sauvegarder la cotation (brouillon ou validation)
        async function sauvegarderCotation(valide) {
            if (!currentCandidat) {
                showToast('⚠️ Aucun candidat en cours', 'error');
                return;
            }
            if (!currentJury) {
                showToast('⚠️ Sélectionnez votre nom de jury', 'error');
                return;
            }

            const total = calculerTotal();
            const data = {
                [currentJury]: {
                    eloquence: parseFloat(eloquence.value) || 0,
                    argumentation: parseFloat(argumentation.value) || 0,
                    structure: parseFloat(structure.value) || 0,
                    gestuelle: parseFloat(gestuelle.value) || 0,
                    total: total,
                    valide: valide,
                    commentaire: commentaire.value || '',
                    timestamp: new Date().toISOString()
                }
            };

            try {
                await db.collection('cotations').doc(currentCandidat).set(data, { merge: true });
                hasVoted = valide;
                isDraft = !valide;
                mettreAJourStatut();
                lastUpdate.textContent = `🕐 ${new Date().toLocaleTimeString()}`;
                showToast(valide ? '✅ Cotation validée !' : '📝 Brouillon sauvegardé', valide ? 'success' : 'warning');
            } catch (error) {
                console.error('❌ Erreur sauvegarde:', error);
                showToast('❌ Erreur: ' + error.message, 'error');
            }
        }

        // Écouter le timer
        function ecouterTimer() {
            db.collection('etat').doc('current').onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.timer !== undefined) {
                        const minutes = Math.floor(data.timer / 60);
                        const seconds = data.timer % 60;
                        timerClock.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                        
                        timerClock.classList.remove('warning', 'danger');
                        if (data.timer <= 30 && data.timerRunning) timerClock.classList.add('danger');
                        else if (data.timer <= 60 && data.timerRunning) timerClock.classList.add('warning');
                    }
                    if (data.timerRunning && !data.timerPaused) {
                        timerStatus.textContent = '▶️ En cours';
                        timerStatus.style.color = '#10b981';
                    } else if (data.timerPaused) {
                        timerStatus.textContent = '⏸️ En pause';
                        timerStatus.style.color = '#f59e0b';
                    } else {
                        timerStatus.textContent = '⏸️ Arrêté';
                        timerStatus.style.color = '#666';
                    }
                }
            });
        }

        // Signaler un problème
        async function signalerProbleme() {
            if (!currentCandidat) {
                showToast('⚠️ Aucun candidat en cours', 'error');
                return;
            }
            if (!currentJury) {
                showToast('⚠️ Sélectionnez votre nom de jury', 'error');
                return;
            }

            if (!confirm(`Signaler un problème pour "${currentCandidat}" ?`)) return;

            try {
                await db.collection('problemes').add({
                    jury: currentJury,
                    candidat: currentCandidat,
                    message: 'Problème signalé par le jury',
                    timestamp: new Date().toISOString(),
                    lu: false
                });
                showToast('📢 Problème signalé au centre de contrôle', 'warning');
            } catch (error) {
                console.error('❌ Erreur signalement:', error);
                showToast('❌ Erreur: ' + error.message, 'error');
            }
        }

        // Événements
        validerBtn.addEventListener('click', () => sauvegarderCotation(true));
        brouillonBtn.addEventListener('click', () => sauvegarderCotation(false));
        problemeBtn.addEventListener('click', signalerProbleme);

        // Initialisation
        ecouterJurys();
        ecouterEtat();
        ecouterTimer();
        showToast('✅ Jury connecté - Sélectionnez votre nom', 'success');
        console.log('🏆 Jury Éloquence en Scène - Connecté à Firebase');
    </script>
</body>
</html>
